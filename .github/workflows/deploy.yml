name: Build & Deploy Mmusic
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  VITE_BASE: /mmusic/
  # NOTE: ยืนยัน path จริงของ mplus.thinkpowers.com บน Hostinger ก่อน deploy ครั้งแรก
  DEPLOY_DIR: /domains/mplus.thinkpowers.com/public_html/apps/mmusic/
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ env.VITE_BASE }}
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 46.202.138.49
          username: u752049395
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ env.DEPLOY_DIR }}
          local-dir: ./dist/
